<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="navbar">
        <div class="nav-button" id="navclicker">
            <p>CLICKER</p>
        </div>
        <div class="nav-button" id="navupgrades">
            <p>UPGRADES</p>
        </div>
        <!--
        <div class="nav-button">
            <p>UPDATE LOG</p>
        </div>
        <div class="nav-button">
            <p>REGISTER</p>
        </div>
        <div class="nav-button">
            <p>CRATES (coming soon)</p>
        </div>
        -->
    </div>
    <div class="infobar">
        <p>User: mikel</p>
        <p style="font-size: smaller;" id="coinsperclick">coins per click: 0</p>
        <p style="font-size: smaller;" id="tokenperclick">UT per click: 0</p>
        <p style="font-size: smaller;" id="currentcoins">coins: 0</p>
        <p style="font-size: smaller;" id="tokens">UT: 0</p>
    </div>
    <div class="containerui">
        <div class="clicker" id="button">
            <p id="coins">0</p>
        </div>
        <div class="upgradetab" id="UPGRADES">
            <h1 style="margin: 10px; border-bottom: 3px solid white; border-top: 3px solid white; margin: auto;">List of
                UPGRADES</h1>
            <div class="cardlist">
                <div class="upgrade1">
                    <div class="cardtitle">
                        <p id="cpstok">clicker - 0</p>
                        <div class="addimg" data-tooltip="purchase upgrade tokens with coins" id="cpsatok">
                            <img src="./add_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.png" alt="add"
                                style="margin: 0; display: block;">
                        </div>
                    </div>
                    <div class="upgrades">
                        <div id="cpsup1" data-tooltip="+0.3 Coins per click req: 1 Clicker" class="clickup">
                            <p>Coins per click</p>
                        </div>
                        <div id="cpsup2" data-tooltip="x1.5 Coins per click req: 4 Clicker" class="clickup">
                            <p>Multiply Clicks</p>
                        </div>
                        <div id="cpsup3" data-tooltip="+0.01 UT per click req: 10 Clicker" class="clickup">
                            <p>UT per click</p>
                        </div>
                        <div id="cpsup4" data-tooltip="+0.5 Coins per click req: 20 Clicker" class="clickup">
                            <p>more clicks</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="buttonline">
                <div class="wipeupgrades" data-tooltip="delete all upgrades">
                    <p>WIPE</p>
                </div>
                <div class="tokens" data-tooltip="used to unlock upgrades" id="ptokens">
                    <p>upgrade token</p>
                </div>
            </div>
        </div>
    </div>
    <div id="tooltip"></div>
    <script src="./game.js"></script>
    <script src="./nav.js"></script>
    <script src="./tooltip.js"></script>
</body>

</html>
